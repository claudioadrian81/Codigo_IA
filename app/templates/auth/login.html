{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="ui middle aligned center aligned grid" style="height:70vh;">
  <div class="six wide column">
    <h2 class="ui teal image header">Ingreso al sistema</h2>
    <form class="ui large form" method="post">
      <div class="ui stacked segment">
        <div class="field">
          <div class="ui left icon input">
            <i class="user icon"></i>
            <input type="text" name="username" placeholder="Usuario" required>
          </div>
        </div>
        <div class="field">
          <div class="ui left icon input">
            <i class="lock icon"></i>
            <input type="password" name="password" placeholder="Contraseña" required>
          </div>
        </div>
        <button class="ui fluid large teal submit button" type="submit">Ingresar</button>
      </div>
    </form>
    <div class="ui message">
      Usuario demo: <strong>admin</strong> | Password: <strong>admin123</strong>
    </div>
  </div>
</div>
{% endblock %}
