{% extends 'base.html' %}
{% block title %}{{ 'Editar usuario' if user else 'Nuevo usuario' }}{% endblock %}
{% block content %}
<h2 class="ui header">{{ 'Editar usuario' if user else 'Nuevo usuario' }}</h2>
<form class="ui form" method="post">
  <div class="field">
    <label>Usuario</label>
    <input type="text" name="username" required maxlength="80" value="{{ user.username if user else '' }}">
  </div>
  <div class="field">
    <label>Contraseña {% if user %}(dejar vacía para mantener){% endif %}</label>
    <input type="password" name="password" {% if not user %}required{% endif %}>
  </div>
  <div class="field">
    <div class="ui checkbox">
      <input type="checkbox" name="is_active" {% if user is none or user.is_active %}checked{% endif %}>
      <label>Activo</label>
    </div>
  </div>
  <button class="ui primary button" type="submit">Guardar</button>
  <a class="ui button" href="{{ url_for('users.list_users') }}">Cancelar</a>
</form>
{% endblock %}
